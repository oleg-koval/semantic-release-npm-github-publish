name: Bot automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      issues: write
    steps:
      - uses: oleg-koval/pr-automerge-github-action@39316e1ba4f70de3f1576da572866841578be442 # v1.5.0
        with:
          github-token: ${{ github.token }}
          maintainer-handles: oleg-koval
          merge-method: squash
